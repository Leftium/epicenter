name: Local Mail browsers

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Playwright's Linux WebKit exposes no `navigator.storage`, so Local Mail
    # cannot open its OPFS data there at all. WebKit runs on macOS, where
    # persistent contexts support OPFS; Chromium stays on Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            os: ubuntu-latest
          - project: webkit
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install the suite's browser version
        working-directory: apps/local-mail/ui
        run: bun x playwright install --with-deps ${{ matrix.project }}
      - name: Check Local Mail and its browser fixtures
        if: matrix.project == 'chromium'
        run: |
          bun run --cwd apps/local-mail typecheck
          bun run --cwd apps/local-mail/ui typecheck
          bun test apps/local-mail
      - name: Run ${{ matrix.project }} journeys
        run: bun run --cwd apps/local-mail test:browser --project ${{ matrix.project }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-mail-browser-failures-${{ matrix.project }}
          path: |
            apps/local-mail/ui/test-results/
            apps/local-mail/ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
