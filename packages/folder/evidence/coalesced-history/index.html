<!doctype html>
<meta charset="utf-8">
<title>Coalesced history acceptance</title>
<style>
	body {
		font: 16px system-ui;
		max-width: 900px;
		margin: 40px auto;
	}
	textarea {
		width: 100%;
		height: 180px;
	}
	button {
		margin: 8px 8px 8px 0;
	}
	pre {
		white-space: pre-wrap;
	}
</style>
<h1>Coalesced history acceptance</h1>
<p>
	Disposable OPFS data on this evidence origin. The text editor saves one
	guarded <code>table.replace</code> at a time, newest body waiting.
</p>
<label
	>Row source<textarea id="editor" aria-label="Row source"></textarea></label
>
<div>
	<button type="button" id="hold">Hold Git protection</button
	><button type="button" id="release">Release Git protection</button>
	<button type="button" id="failure">Fail next Git admission</button
	><button type="button" id="inspect">Inspect files and history</button>
	<button type="button" id="hold-branch">Hold next branch publication</button
	><button type="button" id="release-branch">Release branch publication</button>
	<button type="button" id="checkpoint">Explicit checkpoint</button
	><button type="button" id="close">Close folder</button>
</div>
<p id="gate">Git protection available</p>
<p id="save"></p>
<pre id="activity"></pre>
<h2>Saved file</h2>
<pre id="saved"></pre>
<h2>Committed file</h2>
<pre id="committed"></pre>
<h2>Recent history</h2>
<pre id="history"></pre>
<script type="module" src="/main.ts"></script>
