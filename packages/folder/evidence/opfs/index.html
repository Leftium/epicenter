<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Browser folder OPFS acceptance</title>
		<style>
			body {
				font:
					14px / 1.4 system-ui,
					sans-serif;
				margin: 2rem;
				max-width: 72rem;
			}
			.status {
				font-weight: 600;
				font-family: ui-monospace, monospace;
			}
			.pass .status {
				color: green;
			}
			.fail .status {
				color: crimson;
			}
			.note .status {
				color: gray;
			}
			table {
				border-collapse: collapse;
				font-family: ui-monospace, monospace;
				font-size: 12px;
			}
			td,
			th {
				border: 1px solid #ccc;
				padding: 2px 6px;
				text-align: left;
			}
			iframe {
				display: none;
			}
		</style>
	</head>
	<body>
		<h1>Browser folder OPFS acceptance</h1>
		<p>
			Each run opens fresh disposable folders through the production browser
			opener, in this origin's private file system, and removes them at the end.
			<button id="run" type="button">Run again</button>
			<button id="reload" type="button">Reload persistence check</button>
		</p>
		<p id="state" data-state="running">Running…</p>
		<h2>Checks</h2>
		<ol id="checks"></ol>
		<h2>Layout: one logical path, one stored file</h2>
		<p id="layout-caption"></p>
		<table id="layout"></table>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
